x-build: &build
  context: .
  dockerfile: docker/compat.Dockerfile

x-service: &service
  platform: linux/amd64

x-dbr17: &dbr17
  DATABRICKS_IMAGE: databricksruntime/standard:17.3-LTS
  PYSPARK_REQUIREMENT: pyspark>=4.0,<4.1

x-dbr18: &dbr18
  DATABRICKS_IMAGE: databricksruntime/standard:18.3-LTS
  PYSPARK_REQUIREMENT: pyspark>=4.1,<4.2

services:
  dbr17-polars1:
    <<: *service
    build:
      <<: *build
      args:
        <<: *dbr17
        POLARS_REQUIREMENT: polars[rtcompat]>=1,<2
    command: ["4.0", "1"]

  dbr17-polars2:
    <<: *service
    build:
      <<: *build
      args:
        <<: *dbr17
        POLARS_REQUIREMENT: polars[rtcompat]>=2,<3
    command: ["4.0", "2"]

  dbr18-polars1:
    <<: *service
    build:
      <<: *build
      args:
        <<: *dbr18
        POLARS_REQUIREMENT: polars[rtcompat]>=1,<2
    command: ["4.1", "1"]

  dbr18-polars2:
    <<: *service
    build:
      <<: *build
      args:
        <<: *dbr18
        POLARS_REQUIREMENT: polars[rtcompat]>=2,<3
    command: ["4.1", "2"]
